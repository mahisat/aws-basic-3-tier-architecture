name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deployment.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  BACKEND_INSTANCE_TAG: my-project-backend-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify AWS_DEPLOY_ROLE_ARN secret (masked)
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is missing or empty"
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_ARN: present (length=${#ROLE_ARN})"
          if [[ "${ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "Format: looks like a valid IAM role ARN"
            echo "Role name (suffix): .../${ROLE_ARN##*/}"
          else
            echo "::warning::Does not match arn:aws:iam::ACCOUNT:role/NAME — check the secret value"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${BACKEND_INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running backend instance found for tag Name=${BACKEND_INSTANCE_TAG}"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /home/ec2-user/app",
              "git pull origin main",
              "chown -R ec2-user:ec2-user /home/ec2-user/app",
              "sudo -u ec2-user bash -lc \"cd /home/ec2-user/app/backend && npm ci && npm run build\"",
              "systemctl restart todo-backend",
              "sleep 2",
              "systemctl is-active todo-backend",
              "curl -sf http://127.0.0.1:5000/health"
            ]' \
            --comment "GitHub Actions backend deploy" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output text
            exit 1
          fi

          echo "Backend deployed successfully via SSM"
