name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Frontend EC2 (Public Subnet)
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.FRONTEND_EC2_PUBLIC_IP }}
          USER: ec2-user
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Copy frontend folder to EC2
          scp -r frontend/ $USER@$HOST:/home/ec2-user/app/
          
          # SSH and restart the application
          ssh $USER@$HOST << 'EOF'
            cd /home/ec2-user/app/frontend
            npm install
            npm run build
            # Kill existing process if running
            pkill -f "npm start" || true
            pkill -f "node" || true
            # Start React app (you can use Nginx or serve directly)
            nohup npm start > app.log 2>&1 &
            echo "Frontend deployed successfully"
          EOF

      - name: Verify Frontend is Running
        run: |
          sleep 5
          curl -f http://${{ secrets.FRONTEND_EC2_PUBLIC_IP }}:3000/ || echo "Frontend health check - may need a few more seconds to start"