name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deployment.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Frontend EC2 (public subnet)
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.FRONTEND_EC2_PUBLIC_IP }}
          USER: ec2-user
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          scp -r frontend/ "$USER@$HOST:/home/ec2-user/app/"

          ssh "$USER@$HOST" << 'EOF'
            set -euo pipefail
            cd /home/ec2-user/app/frontend
            npm ci
            npm run build
            sudo mkdir -p /var/www/frontend
            sudo rm -rf /var/www/frontend/*
            sudo cp -r dist/* /var/www/frontend/
            sudo systemctl reload nginx
          EOF

      - name: Verify frontend HTTP
        run: |
          sleep 5
          curl -fsS "http://${{ secrets.FRONTEND_EC2_PUBLIC_IP }}/" -o /dev/null
