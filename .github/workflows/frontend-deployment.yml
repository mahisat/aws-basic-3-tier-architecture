name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deployment.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Frontend EC2 (public subnet)
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.FRONTEND_EC2_PUBLIC_IP }}
          BACKEND_HOST: ${{ secrets.BACKEND_EC2_PRIVATE_IP }}
          USER: ec2-user
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          scp -r frontend/ "$USER@$HOST:/home/ec2-user/app/"

          cat > /tmp/frontend-nginx.conf << NGINX
          server {
              listen 80;
              server_name _;
              root /var/www/frontend;
              index index.html;
              location / {
                  try_files \$uri \$uri/ /index.html;
              }
              location = /health {
                  proxy_pass http://${BACKEND_HOST}:5000/health;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
              }
              location /api/ {
                  proxy_pass http://${BACKEND_HOST}:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 60s;
              }
          }
          NGINX
          scp /tmp/frontend-nginx.conf "$USER@$HOST:/tmp/frontend-nginx.conf"

          ssh "$USER@$HOST" << 'EOF'
            set -euo pipefail
            cd /home/ec2-user/app/frontend
            printf 'VITE_API_BASE_URL=/api\n' > .env.production
            npm ci
            npm run build
            sudo mkdir -p /var/www/frontend
            sudo rm -rf /var/www/frontend/*
            sudo cp -r dist/* /var/www/frontend/
            if command -v setsebool >/dev/null 2>&1; then
              sudo setsebool -P httpd_can_network_connect 1 || true
            fi
            sudo mv /tmp/frontend-nginx.conf /etc/nginx/conf.d/frontend.conf
            sudo nginx -t
            sudo systemctl reload nginx
          EOF

      - name: Verify frontend and API proxy
        run: |
          sleep 5
          curl -fsS "http://${{ secrets.FRONTEND_EC2_PUBLIC_IP }}/" -o /dev/null
          curl -fsS "http://${{ secrets.FRONTEND_EC2_PUBLIC_IP }}/health"
